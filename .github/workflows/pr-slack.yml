name: PR → Slack (reusable)

# Announces three moments in Viorant's review flow to #engineering:
#   🔵 a PR was opened against main
#   ✅ that PR's CI went green for the first time — ready for review
#   🔄 a green landed while the PR still reads CHANGES_REQUESTED — the author
#      answered a review, so it is back in the reviewer's queue
#
# Called by `.github/workflows/pr-slack.yml` in viorant-hub / -control / -shared
# / -runner. Deliberately decoupled from each repo's ci.yml: it is not a
# required status check and cannot gate a merge in either direction.
#
# Re-run noise is gated by a `ci:green` label on the PR itself. Green posts only
# when the label is absent. Two things remove it: a non-success CI run, and a
# review requesting changes — so an ordinary push onto an already-green PR stays
# silent, while the green that answers a review re-announces. The state is
# therefore visible on the PR and self-healing — delete the label by hand to
# force a re-announce.

on:
  workflow_call:
    inputs:
      label:
        description: PR label used to remember that a green CI was already announced.
        type: string
        required: false
        default: 'ci:green'
      jira-base-url:
        description: Atlassian base URL used to link the VIOR key.
        type: string
        required: false
        default: 'https://viorant.atlassian.net'
    secrets:
      # Distinct from SLACK_RELEASE_WEBHOOK, which targets #release. There is
      # deliberately no fallback to it: a silent fallback would keep announcing
      # PRs in the release channel.
      SLACK_ENG_WEBHOOK:
        description: Incoming webhook for #engineering. Absent → the run warns and posts nothing.
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # One step decides everything, so the posting step stays a dumb executor
      # and every skip reason lands in the log.
      - name: Resolve the PR and decide whether to post
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL: ${{ inputs.label }}
          # `pull_request` payload — everything needed is already here. The
          # `pull_request_review` payload carries the same object, so the review
          # branch reads these too and only needs the review's own state.
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_TITLE: ${{ github.event.pull_request.title }}
          PR_EVENT_URL: ${{ github.event.pull_request.html_url }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_EVENT_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_EVENT_BASE: ${{ github.event.pull_request.base.ref }}
          PR_EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          # `pull_request_review` payload — approved | changes_requested |
          # commented.
          REVIEW_STATE: ${{ github.event.review.state }}
          # `workflow_run` payload — carries only the PR number, so the rest is
          # fetched. `pull_requests` is populated because Viorant has no forks.
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HTML_URL: ${{ github.event.workflow_run.html_url }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          out() { printf '%s<<PRSLACK_EOF\n%s\nPRSLACK_EOF\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          skip() { echo "pr-slack: $1"; echo 'post=false' >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            if [ "$PR_EVENT_DRAFT" = 'true' ]; then
              skip 'draft PR — waiting for ready_for_review'
            fi
            out event opened
            out number "$PR_EVENT_NUMBER"
            out title "$PR_EVENT_TITLE"
            out url "$PR_EVENT_URL"
            out author "$PR_EVENT_AUTHOR"
            out head "$PR_EVENT_HEAD"
            out base "$PR_EVENT_BASE"
            out run_url ''
            echo 'post=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A review never posts anything — the reviewer already knows what they
          # asked for. `changes_requested` only forgets the announced green, so
          # that the green answering it re-announces. `branches:` is not a legal
          # filter for pull_request_review, so base is checked here.
          if [ "$EVENT_NAME" = 'pull_request_review' ]; then
            state="$(printf '%s' "${REVIEW_STATE:-}" | tr '[:upper:]' '[:lower:]')"
            if [ "$state" != 'changes_requested' ]; then
              skip "review state '$state' — only changes_requested clears '$LABEL'"
            fi
            if [ "$PR_EVENT_BASE" != 'main' ]; then
              skip "review on PR #$PR_EVENT_NUMBER targeting '$PR_EVENT_BASE', not main"
            fi
            gh pr edit "$PR_EVENT_NUMBER" --remove-label "$LABEL" >/dev/null 2>&1 || true
            skip "changes requested on PR #$PR_EVENT_NUMBER — cleared '$LABEL' so the fix's green re-announces"
          fi

          if [ -z "${RUN_PR_NUMBER:-}" ]; then
            skip 'CI run is not attached to a PR (push to main)'
          fi

          pr="$(gh pr view "$RUN_PR_NUMBER" \
                 --json number,title,url,author,baseRefName,headRefName,isDraft,labels,reviewDecision)"

          base="$(jq -r '.baseRefName' <<<"$pr")"
          if [ "$base" != 'main' ]; then
            skip "PR #$RUN_PR_NUMBER targets '$base', not main"
          fi

          if [ "$RUN_CONCLUSION" != 'success' ]; then
            gh pr edit "$RUN_PR_NUMBER" --remove-label "$LABEL" >/dev/null 2>&1 || true
            skip "CI concluded '$RUN_CONCLUSION' — cleared '$LABEL' so the next green re-announces"
          fi

          if [ "$(jq -r '.isDraft' <<<"$pr")" != 'false' ]; then
            skip "PR #$RUN_PR_NUMBER is a draft"
          fi

          if jq -e --arg l "$LABEL" 'any(.labels[]; .name == $l)' >/dev/null <<<"$pr"; then
            skip "PR #$RUN_PR_NUMBER already carries '$LABEL' — green already announced"
          fi

          # `reviewDecision` stays CHANGES_REQUESTED across pushes until a new
          # review supersedes it, so a green arriving while it still reads that
          # is the author answering the request — name it as such.
          if [ "$(jq -r '.reviewDecision // ""' <<<"$pr")" = 'CHANGES_REQUESTED' ]; then
            out event rereview
          else
            out event ci
          fi
          out remember true
          out number "$(jq -r '.number' <<<"$pr")"
          out title "$(jq -r '.title' <<<"$pr")"
          out url "$(jq -r '.url' <<<"$pr")"
          out author "$(jq -r '.author.login' <<<"$pr")"
          out head "$(jq -r '.headRefName' <<<"$pr")"
          out base "$base"
          out run_url "$RUN_HTML_URL"
          echo 'post=true' >> "$GITHUB_OUTPUT"

      - name: Check out the notifier
        if: steps.gate.outputs.post == 'true'
        uses: actions/checkout@v5
        with:
          repository: viorant/.github
          ref: main
          sparse-checkout: scripts/pr-slack

      - name: Post to Slack
        if: steps.gate.outputs.post == 'true'
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ENG_WEBHOOK }}
          JIRA_BASE_URL: ${{ inputs.jira-base-url }}
          EVENT: ${{ steps.gate.outputs.event }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.number }}
          PR_TITLE: ${{ steps.gate.outputs.title }}
          PR_URL: ${{ steps.gate.outputs.url }}
          PR_AUTHOR: ${{ steps.gate.outputs.author }}
          HEAD_REF: ${{ steps.gate.outputs.head }}
          BASE_REF: ${{ steps.gate.outputs.base }}
          RUN_URL: ${{ steps.gate.outputs.run_url }}
        run: node scripts/pr-slack/notify.mjs

      # After the post, never before: a lost label re-announces (harmless),
      # a label set on a failed post loses the announcement entirely.
      #
      # Gated on its own output rather than on the event name, so adding a
      # fourth message cannot silently break the label bookkeeping.
      - name: Remember that green was announced
        if: steps.gate.outputs.post == 'true' && steps.gate.outputs.remember == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LABEL: ${{ inputs.label }}
          PR_NUMBER: ${{ steps.gate.outputs.number }}
        run: |
          set -euo pipefail
          gh label create "$LABEL" --color 0E8A16 \
            --description 'CI green announced in Slack' --force >/dev/null 2>&1 || true
          gh pr edit "$PR_NUMBER" --add-label "$LABEL"
